                <div class="contact-us-content">

                    <form id="contact-form" class="contact-us-form" action="https://api.web3forms.com/submit" method="POST">

                        <input type="hidden" name="access_key" value="ebc6be6e-ee8c-4012-8e90-a58eb6766c30">

                        <!-- Form-level subject (what you see in your inbox) -->
                        <input type="hidden" name="subject" id="subject-input" value="General inquiry">

                        <!-- Honeypot for spam protection -->
                        <input type="checkbox" name="botcheck" class="hidden" style="display:none">

                        <!-- Reply-to (user email) -->
                        <input type="hidden" name="replyto" value="email">

                        <h3 class="h3-font">CONTACT US</h3>

                        <input class="font border" id="name-input" name="name"  placeholder="Name*">
                        <input inputmode="numeric" type="tel" class="font border" name="phone"  id="phone-input" placeholder="Phone number" >
                        <input class="font border" id="email-input" name="email" placeholder="Email*">
                        <div class="dropdown">
                            <button id="subject-btn" class="border">
                                <span class="font">Subject/Category</span>
                                <svg  class="dropdown-arrow" width="64px" height="35px" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><g id="SVGRepo_bgCarrier" stroke-width="0"></g><g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g><g id="SVGRepo_iconCarrier"> <path fill-rule="evenodd" clip-rule="evenodd" d="M12.7071 14.7071C12.3166 15.0976 11.6834 15.0976 11.2929 14.7071L6.29289 9.70711C5.90237 9.31658 5.90237 8.68342 6.29289 8.29289C6.68342 7.90237 7.31658 7.90237 7.70711 8.29289L12 12.5858L16.2929 8.29289C16.6834 7.90237 17.3166 7.90237 17.7071 8.29289C18.0976 8.68342 18.0976 9.31658 17.7071 9.70711L12.7071 14.7071Z" fill="#000000"></path> </g></svg>
                            </button>
                            <ul class="subject-options font">
                                <li><a href=""></a>General inquiry</li>
                                <li><a href=""></a>Reservation-related question</li>
                                <li><a href=""></a>Catering/event request</li>
                                <li><a href=""></a>Feedback/complaint</li>
                             </ul>
                        </div>
                        <textarea class="font border" id="message-input" name="message" placeholder="Message*"></textarea>

                        <!-- hCaptcha widget -->
                        <div class="h-captcha" data-sitekey="ebc6be6e-ee8c-4012-8e90-a58eb6766c30"></div>

                        <button class="font reusable-btn" id="send-msg-btn">SUBMIT</button>
                    </form>
